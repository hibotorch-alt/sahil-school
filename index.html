<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- منع الكاش لضمان تحديث التعديلات فوراً للزوار -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>تسجيل الطلاب - Sahil School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>استمارة التسجيل في مدرسة Sahil School</h2>
        <p>يرجى ملء كافة البيانات التالية لإتمام عملية التسجيل:</p>

        <form id="registrationForm">
            <div class="form-group">
                <label for="firstName">الاسم الأول:</label>
                <input type="text" id="firstName" name="firstName" required placeholder="أدخل الاسم الأول">
            </div>

            <div class="form-group">
                <label for="lastName">اللقب:</label>
                <input type="text" id="lastName" name="lastName" required placeholder="أدخل اللقب">
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="phone" required placeholder="06XXXXXXXX">
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>

            <div class="form-group">
                <label for="level">المستوى الدراسي:</label>
                <select id="level" name="level" required>
                    <option value="" disabled selected>اختر المستوى</option>
                    <option value="ابتداءي">ابتدائي</option>
                    <option value="متوسط">متوسط</option>
                    <option value="ثانوي">ثانوي</option>
                    <option value="جامعي">جامعي / عام</option>
                </select>
            </div>

            <div class="form-group">
                <label for="courses">الدورة المطلوبة:</label>
                <input type="text" id="courses" name="courses" required placeholder="مثال: لغات، دعم، برمجة...">
            </div>

            <button type="submit" id="submitBtn">تسجيل الآن</button>
        </form>
    </div>

    <!-- استدعاء ملف الجافاسكربت -->
    <script src="script.js"></script>
</body>
</html>
